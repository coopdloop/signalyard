name: signalyard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalyard
      POSTGRES_PASSWORD: signalyard
      POSTGRES_DB: signalyard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalyard"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api-gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.core-api-gateway
    environment:
      PORT: "8080"
      POSTGRES_DSN: postgres://signalyard:signalyard@postgres:5432/signalyard
      NATS_URL: nats://nats:4222
      JWT_SIGNING_SECRET: dev-jwt-secret-change-me
      HEC_TOKEN_SALT: dev-hec-salt-change-me
      DEV_ADMIN_TOKEN: dev-admin-token
      RUN_MIGRATIONS: "true"
      MIGRATIONS_DIR: /app/migrations
      SCHEMA_REGISTRY_URL: http://schema-registry:8082
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      OIDC_ISSUER_URL: http://localhost:8180/realms/signalyard
      OIDC_CLIENT_ID: signalyard-dashboard
      OIDC_CLIENT_SECRET: dev-core-secret
    extra_hosts:
      # dev: let the container reach Keycloak via the host-published port so the
      # token issuer (localhost:8180) matches what the browser sees
      - "localhost:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  schema-registry:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.schema-registry
    environment:
      PORT: "8082"
      POSTGRES_DSN: postgres://signalyard:signalyard@postgres:5432/signalyard
      NATS_URL: nats://nats:4222
      HEC_TOKEN_SALT: dev-hec-salt-change-me
      JWT_SIGNING_SECRET: dev-jwt-secret-change-me
      DEV_ADMIN_TOKEN: dev-admin-token
      # GIT_REPO_URL / GIT_SSH_KEY_PATH: unset in dev -> NoopGit (Postgres is source of truth)
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  normalizer-router:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.normalizer-router
    environment:
      PORT: "8081"
      POSTGRES_DSN: postgres://signalyard:signalyard@postgres:5432/signalyard
      NATS_URL: nats://nats:4222
      SCHEMA_REGISTRY_URL: http://schema-registry:8082
      SCHEMA_REGISTRY_TOKEN: dev-admin-token
      HEC_TOKEN_SALT: dev-hec-salt-change-me
      JWT_SIGNING_SECRET: dev-jwt-secret-change-me
      DEV_ADMIN_TOKEN: dev-admin-token
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      schema-registry:
        condition: service_started

  webhook-adapter:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.webhook-adapter
    environment:
      PORT: "8084"
      POSTGRES_DSN: postgres://signalyard:signalyard@postgres:5432/signalyard
      NATS_URL: nats://nats:4222
      GITHUB_WEBHOOK_SECRET: dev-github-secret
      JIRA_WEBHOOK_SECRET: dev-jira-secret
      PAGERDUTY_WEBHOOK_SECRET: dev-pagerduty-secret
      MARBLE_JAR_WEBHOOK_SECRET: dev-marble-jar-secret
      HEC_TOKEN_SALT: dev-hec-salt-change-me
      JWT_SIGNING_SECRET: dev-jwt-secret-change-me
      DEV_ADMIN_TOKEN: dev-admin-token
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  classifier:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.classifier
    environment:
      PORT: "8083"
      NATS_URL: nats://nats:4222
      SCHEMA_REGISTRY_URL: http://schema-registry:8082
      SCHEMA_REGISTRY_TOKEN: dev-admin-token
      POSTGRES_DSN: postgres://signalyard:signalyard@postgres:5432/signalyard
      LLM_PROVIDER: heuristic
      # ANTHROPIC_API_KEY / OPENAI_API_KEY / OLLAMA_BASE_URL: set to use a real LLM backend
      HEC_TOKEN_SALT: dev-hec-salt-change-me
      JWT_SIGNING_SECRET: dev-jwt-secret-change-me
      DEV_ADMIN_TOKEN: dev-admin-token
      CLUSTER_THRESHOLD: "3"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      schema-registry:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
      - mimir

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"

  mimir:
    image: grafana/mimir:2.15.0
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir.yaml:/etc/mimir.yaml:ro
      - mimirdata:/data
    ports:
      - "9009:9009"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - mimir

  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    volumes:
      - ./keycloak/realm-signalyard.json:/opt/keycloak/data/import/realm-signalyard.json:ro
    ports:
      - "8180:8080"

  dashboard:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.dashboard
    ports:
      - "8085:80"
    depends_on:
      - core-api-gateway
      - schema-registry

volumes:
  pgdata:
  natsdata:
  lokidata:
  tempodata:
  mimirdata:
  grafanadata:
