[project]
name = "signalyard-classifier"
version = "0.1.0"
description = "Signal Yard classifier_agent_service: classifies quarantined unknown-shape events and proposes schema patches"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "nats-py>=2.9",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
