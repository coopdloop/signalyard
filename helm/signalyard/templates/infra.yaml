{{- if .Values.postgres.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "signalyard.fullname" . }}-postgres
  labels:
    {{- include "signalyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "signalyard.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: signalyard
            - name: POSTGRES_PASSWORD
              value: signalyard
            - name: POSTGRES_DB
              value: signalyard
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signalyard.fullname" . }}-postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
{{- end }}
{{- if .Values.nats.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "signalyard.fullname" . }}-nats
  labels:
    {{- include "signalyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "signalyard.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-js"]
          ports:
            - containerPort: 4222
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signalyard.fullname" . }}-nats
spec:
  selector:
    app.kubernetes.io/component: nats
  ports:
    - port: 4222
{{- end }}
